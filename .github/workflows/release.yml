# Builds release binaries for all supported platforms and attaches them
# to a GitHub Release. Triggered by pushing a tag matching `v*`, e.g.:
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# Or via the workflow_dispatch button in the Actions UI.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1) — must already exist as a git tag"
        required: true

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/release_check.py --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14         # Apple Silicon runner, native build
            wheel_platform: macosx_11_0_arm64
          - target: x86_64-apple-darwin
            os: macos-14         # cross-compile from arm64 — macos-13 pool
                                 # is deprecated and queues forever; arm64
                                 # → x86_64 cross works first try (Apple's
                                 # clang handles it; BoringSSL fine).
                                 # Smoke test runs the x86_64 binary via
                                 # Rosetta on the arm64 runner.
            wheel_platform: macosx_10_12_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm  # GitHub native ARM64 runner — covers Graviton2/3/4
            wheel_platform: manylinux_2_35_aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # wreq pulls in boring-sys2 (BoringSSL) which needs cmake + ninja.
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          # Apple's bundled clang already supports cross-compilation between
          # arm64 and x64; cargo --target handles the rest.

      - name: Install build deps (Linux)
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install build deps (manylinux)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          yum install -y cmake ninja-build

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install Rosetta for Intel macOS smoke
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          # Verify the binary at least starts and accepts a `close` command.
          # Intel macOS runs under Rosetta on the arm64 macOS runner.
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && [ "$(uname -m)" = "x86_64" ]; then
            echo "skip: cross-compiled binary, host can't run it"
            exit 0
          fi
          echo '{"id":1,"method":"close"}' | ./target/${{ matrix.target }}/release/unbrowser > /tmp/out
          cat /tmp/out
          grep -q '"result":"bye"' /tmp/out

      - name: Package archive
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../unbrowser-${{ matrix.target }}.tar.gz unbrowser

      - name: Compute checksum
        run: |
          shasum -a 256 unbrowser-${{ matrix.target }}.tar.gz > unbrowser-${{ matrix.target }}.tar.gz.sha256
          cat unbrowser-${{ matrix.target }}.tar.gz.sha256

      # ---- Python wheel ----
      # Bundle the freshly-built native binary into a Python wheel for this
      # platform. End users then `pip install pyunbrowser` and get a working
      # binary with nothing else to install. The same wheel is published
      # to PyPI by the publish-pypi job. (PyPI distribution is `pyunbrowser`
      # because PyPI's name moderation blocks `unbrowser`; the import name
      # remains `unbrowser` everywhere.)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bundle binary into Python package
        run: |
          cp target/${{ matrix.target }}/release/unbrowser python/unbrowser/_bin/unbrowser
          chmod +x python/unbrowser/_bin/unbrowser

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build wheel
          rm -rf python/dist
          cd python && python -m build --wheel

      - name: Re-tag wheel for ${{ matrix.wheel_platform }}
        # Re-tag to the exact target platform since the wheel bundles a
        # platform-specific binary. Hatchling may emit either py3-none-any or a
        # host-platform tag depending on backend version/config.
        run: |
          cd python/dist
          wheel=$(python - <<'PY'
          import glob
          wheels = glob.glob('pyunbrowser-*.whl')
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )
          python -m wheel tags --remove --platform-tag ${{ matrix.wheel_platform }} "$wheel"
          ls -la

      - name: Validate wheel contents
        run: |
          python - <<'PY'
          import glob
          import os
          import stat
          import zipfile

          wheels = glob.glob("python/dist/pyunbrowser-*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
              assert "unbrowser/_bin/unbrowser" in names, sorted(names)
              mode = z.getinfo("unbrowser/_bin/unbrowser").external_attr >> 16
              assert mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH), oct(mode)
          print(wheels[0])
          PY

      - name: Smoke test wheel install
        run: |
          set -eu
          wheel=$(ls python/dist/pyunbrowser-*.whl)
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ]; then
            # pip cannot install an x86_64-tagged wheel into an arm64 venv, but
            # it can unpack it for that target. Then the pure-Python wrapper can
            # run on arm64 Python while spawning the bundled x86_64 binary under
            # Rosetta, which validates the wheel payload before publish.
            rm -rf /tmp/pyunbrowser-wheel-smoke
            mkdir -p /tmp/pyunbrowser-wheel-smoke
            python -m pip install --upgrade pip
            python -m pip install \
              --target /tmp/pyunbrowser-wheel-smoke \
              --platform ${{ matrix.wheel_platform }} \
              --implementation py \
              --python-version 311 \
              --abi none \
              --only-binary=:all: \
              --no-deps \
              "$wheel"
            PYTHONPATH=/tmp/pyunbrowser-wheel-smoke python - <<'PY'
          import json
          import os
          import subprocess
          import unbrowser

          path = unbrowser.find_binary()
          assert os.path.isfile(path), path
          print(unbrowser.__version__, path)

          out = subprocess.check_output(
              [path],
              input='{"id":1,"method":"close","params":{}}\n',
              text=True,
          )
          assert '"result":"bye"' in out, out

          proc = subprocess.Popen(
              [path, "--mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          assert proc.stdin is not None and proc.stdout is not None
          proc.stdin.write(json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "release-smoke", "version": "0"},
              },
          }) + "\n")
          proc.stdin.flush()
          line = proc.stdout.readline()
          assert '"id":1' in line and '"result"' in line, line
          proc.stdin.close()
          proc.wait(timeout=5)
          PY
            exit 0
          fi
          python -m venv /tmp/pyunbrowser-wheel-smoke
          . /tmp/pyunbrowser-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$wheel"
          python - <<'PY'
          import json
          import os
          import subprocess
          import unbrowser

          path = unbrowser.find_binary()
          assert os.path.isfile(path), path
          print(unbrowser.__version__, path)

          out = subprocess.check_output(
              [path],
              input='{"id":1,"method":"close","params":{}}\n',
              text=True,
          )
          assert '"result":"bye"' in out, out

          proc = subprocess.Popen(
              ["unbrowser", "--mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          assert proc.stdin is not None and proc.stdout is not None
          proc.stdin.write(json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "release-smoke", "version": "0"},
              },
          }) + "\n")
          proc.stdin.flush()
          line = proc.stdout.readline()
          assert '"id":1' in line and '"result"' in line, line
          proc.stdin.close()
          proc.wait(timeout=5)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unbrowser-${{ matrix.target }}
          path: |
            unbrowser-${{ matrix.target }}.tar.gz
            unbrowser-${{ matrix.target }}.tar.gz.sha256
            python/dist/pyunbrowser-*.whl
          if-no-files-found: error
          retention-days: 7

  build-x86_64-unknown-linux-gnu:
    name: Build x86_64-unknown-linux-gnu
    needs: preflight
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -yq --no-install-recommends ca-certificates cmake curl git build-essential ninja-build pkg-config clang libclang-dev python3 python3-pip python3-venv

      - name: Install Rust toolchain
        run: |
          export HOME=/root
          export CARGO_HOME=/root/.cargo
          export RUSTUP_HOME=/root/.rustup
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install stable --target x86_64-unknown-linux-gnu --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Smoke test (Unix)
        run: |
          echo '{"id":1,"method":"close"}' | ./target/x86_64-unknown-linux-gnu/release/unbrowser > /tmp/out
          cat /tmp/out
          grep -q '"result":"bye"' /tmp/out

      - name: Package archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../unbrowser-x86_64-unknown-linux-gnu.tar.gz unbrowser

      - name: Compute checksum
        run: |
          sha256sum unbrowser-x86_64-unknown-linux-gnu.tar.gz > unbrowser-x86_64-unknown-linux-gnu.tar.gz.sha256
          cat unbrowser-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Bundle binary into Python package
        run: |
          cp target/x86_64-unknown-linux-gnu/release/unbrowser python/unbrowser/_bin/unbrowser
          chmod +x python/unbrowser/_bin/unbrowser

      - name: Build wheel
        run: |
          python3 -m pip install --upgrade pip build 'wheel>=0.40.0'
          rm -rf python/dist
          cd python && python3 -m build --wheel

      - name: Re-tag wheel for manylinux_2_31_x86_64
        # Re-tag to manylinux because the wheel bundles the native binary in
        # unbrowser/_bin/. Hatchling may emit either py3-none-any or a host
        # platform tag depending on backend version/config.
        run: |
          cd python/dist
          wheel=$(python3 - <<'PY'
          import glob
          wheels = glob.glob('pyunbrowser-*.whl')
          assert len(wheels) == 1, wheels
          print(wheels[0])
          PY
          )
          # `--remove` strips the original platform tag before we add the real
          # Linux target. `wheel tags` is required here because the package is
          # not an extension module, just a Python wrapper around a binary.
          python3 -m wheel tags --remove --platform-tag manylinux_2_31_x86_64 "$wheel"
          ls -la

      - name: Validate wheel contents
        run: |
          python3 - <<'PY'
          import glob
          import os
          import stat
          import zipfile

          wheels = glob.glob("python/dist/pyunbrowser-*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
              assert "unbrowser/_bin/unbrowser" in names, sorted(names)
              mode = z.getinfo("unbrowser/_bin/unbrowser").external_attr >> 16
              assert mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH), oct(mode)
          print(wheels[0])
          PY

      - name: Smoke test wheel install
        run: |
          set -eu
          wheel=$(ls python/dist/pyunbrowser-*.whl)
          python3 -m venv /tmp/pyunbrowser-wheel-smoke
          . /tmp/pyunbrowser-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --ignore-requires-python "$wheel"
          python - <<'PY'
          import json
          import os
          import subprocess
          import unbrowser

          path = unbrowser.find_binary()
          assert os.path.isfile(path), path
          print(unbrowser.__version__, path)

          out = subprocess.check_output(
              [path],
              input='{"id":1,"method":"close","params":{}}\n',
              text=True,
          )
          assert '"result":"bye"' in out, out

          proc = subprocess.Popen(
              ["unbrowser", "--mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
          )
          assert proc.stdin is not None and proc.stdout is not None
          proc.stdin.write(json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "release-smoke", "version": "0"},
              },
          }) + "\n")
          proc.stdin.flush()
          line = proc.stdout.readline()
          assert '"id":1' in line and '"result"' in line, line
          proc.stdin.close()
          proc.wait(timeout=5)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unbrowser-x86_64-unknown-linux-gnu
          path: |
            unbrowser-x86_64-unknown-linux-gnu.tar.gz
            unbrowser-x86_64-unknown-linux-gnu.tar.gz.sha256
            python/dist/pyunbrowser-*.whl
          if-no-files-found: error
          retention-days: 7

  # Publish wheels (one per platform from `build`) to PyPI via
  # OIDC trusted publishing — no PYPI_API_TOKEN secret to manage. Requires
  # the user to configure a Trusted Publisher on PyPI for this repo +
  # workflow + environment ONCE before the first tag push:
  #   PyPI -> Account -> Publishing -> Add a pending publisher
  #   Project name: pyunbrowser  (claims the name on first publish)
  #   Owner: protostatis
  #   Repository: unbrowser
  #   Workflow filename: release.yml
  #   Environment name: pypi   (must match the `environment:` field below)
  publish-pypi:
    name: Publish to PyPI
    needs: [build, build-x86_64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    # Publish on tag pushes and explicit manual release dispatches.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write   # required for OIDC trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/pyunbrowser
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-staging
      - name: Collect distributions into single dist/ dir
        # download-artifact gives one subdir per artifact name; flatten
        # into a single dist/ that gh-action-pypi-publish expects.
        run: |
          mkdir -p dist
          # No sdist until the source package can build/install the native
          # Rust binary. Publishing a binary-less sdist installs a broken
          # console wrapper on unsupported platforms.
          find dist-staging -name 'pyunbrowser-*.whl' -exec cp {} dist/ \;
          ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password` field — Trusted Publishing uses the OIDC token
        # the GitHub runner already has.

  release:
    name: Create Release
    needs: [build, build-x86_64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0   # full history so generate_release_notes works

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unbrowser-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            unbrowser-*.tar.gz
            unbrowser-*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            Pick your platform and download:

            | Platform | Asset |
            |---|---|
            | macOS Apple Silicon | `unbrowser-aarch64-apple-darwin.tar.gz` |
            | macOS Intel | `unbrowser-x86_64-apple-darwin.tar.gz` |
            | Linux x86_64 — EC2, Ubuntu 20.04+, AL2023 | `unbrowser-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux arm64 — Graviton2/3/4, Ubuntu 22.04+ | `unbrowser-aarch64-unknown-linux-gnu.tar.gz` |

            ### One-liner (macOS / Linux):

            ```bash
            curl -L https://github.com/protostatis/unbrowser/releases/download/${{ github.event.inputs.tag || github.ref_name }}/unbrowser-$(uname -m | sed 's/arm64/aarch64/')-$(uname -s | tr A-Z a-z | sed 's/darwin/apple-darwin/;s/linux/unknown-linux-gnu/').tar.gz \
              | tar xz -C /usr/local/bin
            unbrowser --mcp
            ```

            ### Verify checksums:

            ```bash
            shasum -a 256 -c unbrowser-*.tar.gz.sha256
            ```

            ## What's new

            See auto-generated changelog below.
