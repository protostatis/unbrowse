<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#0a0a0f;font-family:monospace">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0a0f"/>
  
  <!-- Title -->
  <text x="600" y="60" fill="#e0e0e6" font-size="32" font-weight="bold" text-anchor="middle">The Chrome Tax</text>
  <text x="600" y="90" fill="#6b6b7b" font-size="16" text-anchor="middle">What heavy browsers cost your AI agent</text>
  
  <!-- Memory Comparison Section -->
  <text x="100" y="160" fill="#6b6b7b" font-size="14" text-transform="uppercase">MEMORY PER SESSION</text>
  
  <!-- Memory bars -->
  <g transform="translate(100, 180)">
    <!-- Chrome/Playwright -->
    <text x="0" y="20" fill="#e0e0e6" font-size="14">Playwright</text>
    <rect x="150" y="5" width="560" height="30" fill="#f87171" rx="4"/>
    <text x="720" y="25" fill="#e0e0e6" font-size="14">280 MB</text>
    
    <!-- Puppeteer -->
    <text x="0" y="70" fill="#e0e0e6" font-size="14">Puppeteer</text>
    <rect x="150" y="55" width="600" height="30" fill="#f87171" rx="4"/>
    <text x="760" y="75" fill="#e0e0e6" font-size="14">300 MB</text>
    
    <!-- unbrowser -->
    <text x="0" y="120" fill="#4ade80" font-size="14" font-weight="bold">unbrowser</text>
    <rect x="150" y="105" width="60" height="30" fill="#4ade80" rx="4"/>
    <text x="220" y="125" fill="#e0e0e6" font-size="14">30 MB</text>
    
    <!-- curl -->
    <text x="0" y="170" fill="#e0e0e6" font-size="14">curl</text>
    <rect x="150" y="155" width="4" height="30" fill="#60a5fa" rx="4"/>
    <text x="160" y="175" fill="#e0e0e6" font-size="14">2 MB</text>
  </g>
  
  <!-- 10x annotation -->
  <g transform="translate(380, 300)">
    <rect x="0" y="0" width="120" height="40" fill="#22c55e33" stroke="#4ade80" stroke-width="1" rx="4"/>
    <text x="60" y="25" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">9x smaller</text>
  </g>
  
  <!-- Token Output Section -->
  <text x="100" y="420" fill="#6b6b7b" font-size="14" text-transform="uppercase">TOKENS PER PAGE</text>
  
  <!-- Token bars -->
  <g transform="translate(100, 440)">
    <!-- Raw HTML -->
    <text x="0" y="20" fill="#e0e0e6" font-size="14">Raw HTML</text>
    <rect x="150" y="5" width="600" height="30" fill="#f87171" rx="4"/>
    <text x="760" y="25" fill="#e0e0e6" font-size="14">12,000</text>
    
    <!-- Markdown -->
    <text x="0" y="70" fill="#e0e0e6" font-size="14">Markdown</text>
    <rect x="150" y="55" width="150" height="30" fill="#fbbf24" rx="4"/>
    <text x="310" y="75" fill="#e0e0e6" font-size="14">3,000</text>
    
    <!-- BlockMap -->
    <text x="0" y="120" fill="#4ade80" font-size="14" font-weight="bold">BlockMap</text>
    <rect x="150" y="105" width="25" height="30" fill="#4ade80" rx="4"/>
    <text x="185" y="125" fill="#e0e0e6" font-size="14">500</text>
  </g>
  
  <!-- 24x annotation -->
  <g transform="translate(350, 560)">
    <rect x="0" y="0" width="130" height="40" fill="#22c55e33" stroke="#4ade80" stroke-width="1" rx="4"/>
    <text x="65" y="25" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">24x fewer tokens</text>
  </g>
  
  <!-- Cold Start Section -->
  <text x="100" y="650" fill="#6b6b7b" font-size="14" text-transform="uppercase">COLD START (LAMBDA)</text>
  
  <!-- Cold start bars -->
  <g transform="translate(100, 670)">
    <!-- Playwright -->
    <text x="0" y="20" fill="#e0e0e6" font-size="14">Playwright</text>
    <rect x="150" y="5" width="400" height="30" fill="#f87171" rx="4"/>
    <text x="560" y="25" fill="#e0e0e6" font-size="14">8.0s</text>
    
    <!-- unbrowser -->
    <text x="0" y="70" fill="#4ade80" font-size="14" font-weight="bold">unbrowser</text>
    <rect x="150" y="55" width="5" height="30" fill="#4ade80" rx="4"/>
    <text x="165" y="75" fill="#e0e0e6" font-size="14">0.1s</text>
  </g>
  
  <!-- 80x annotation -->
  <g transform="translate(350, 745)">
    <rect x="0" y="0" width="120" height="40" fill="#22c55e33" stroke="#4ade80" stroke-width="1" rx="4"/>
    <text x="60" y="25" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">80x faster</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="785" fill="#6b6b7b" font-size="12" text-anchor="middle">unbrowser: stateful WebFetch for LLM agents · unchainedsky.com/unbrowser</text>
</svg>